name: Validate WDI V2 corpus
on:
  push:
    branches: [main, "product/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate V2 static corpus and file contract
        run: python evaluation/validate_v2.py

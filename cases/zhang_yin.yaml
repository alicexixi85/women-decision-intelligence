identity:
  name: 张茵 (Zhang Yin)
  nationality: 中国 (China)
  era: 现代 (1957年出生，1985年28岁借款赴港起步，1995年38岁创立玖龙纸业)
  industry: 实体工业制造 / 循环经济 / 造纸与包装 (Manufacturing / Paper & Packaging)
  role: 玖龙纸业创始人兼董事长、中国首位女首富（2006年胡润百富榜）

background:
  childhood: 出生于广东韶关军人家庭，因特殊历史时期父亲蒙冤入狱，作为家中 8 个孩子的老大，自幼挑起照顾全家弟妹、洗衣做饭、操持家务的重担。
  family: 军人家庭背景，培养了雷厉风行、极度坚毅且极其注重家庭团结的性格。
  socioeconomic_background: 普通工薪家庭，因家庭变故早年生活艰难，无家族资本。
  education: 电视大学进修会计与财务专业，具备扎实的财务记账与成本核算功底。
  initial_resources: 28 岁时手头无资产，仅凭借在深圳合资纺织厂担任财务部长的信誉，向朋友借款 3 万元人民币赴港闯荡。

life_stage:
  age_at_key_decision: 28 岁孤身赴港进入被黑道把持的废纸回收行业；33 岁赴美创办中南控股打通全球原料废纸供应链；38 岁在东莞投资 1.1 亿美元兴建玖龙造纸基地；51 岁遭遇 2008 年全球金融海啸与破产做空危机并逆风翻盘。
  relationship_status_if_relevant: 与台胞医生兼商业搭档刘名中结婚，夫妻共同长期操盘实业，分工明确。
  children_if_publicly_documented: 育有两子（刘晋嵩、刘晋强），完成学业后进入玖龙核心管理层负责技术与运营。
  caregiving_responsibility_if_relevant: 青年时期承担原生家庭弟妹的抚育与安置责任；创业成熟后将家族成员团结在企业合规架构内。

constraints:
  financial: 启动资金仅为借贷的 3 万元，容错率为零，一旦亏损将背负终身债务。
  family: 身负长姐如母的沉重原生家庭经济兜底重任。
  reproductive: 在 30 岁前后经历跨国创业与孕产，通过与伴侣的高度协作度过兼顾期。
  social: 香港 1980 年代废纸回收行业充斥着黑社会三合会势力、地痞流氓与暴力垄断。
  gender: 年轻大陆女性只身进入香港粗粝的废旧物资回收界，被香港本土男性帮派视为“软柿子”，频繁遭遇人身恐吓与上门勒索。
  career: 从体制边缘的会计转行做最脏、最累的废品垃圾回收。
  age: 28 岁起步，38 岁主导上亿重资产工厂建设。
  geography: 从广东韶关、深圳跨越至香港，再到美国加州，最终回流东莞、太仓建立百亿基地。
  immigration: 香港居留权，后拓展至跨国营运。
  capital_access: 早期无商业银行敢向大陆背景的小微废纸商发放贷款。

career:
  previous_work: 深圳信联纺织企业财务部长、贸易业务员。
  transition: 发现内地造纸原料极度匮乏、森林砍伐受限，而香港工业与居民废纸丰富，敏锐看到废纸回收的巨大替代红利。
  business_model: 全球废纸原料逆向物流采购 + 先进大型自动化造纸流水线 + 珠三角/长三角世界工厂包装纸直接供应。
  source_of_capital: 3 万元借款自筹起步 + 贸易利润留存 + 国际银团设备抵押贷款 + 2006 年香港联交所 IPO。
  ownership: 家族信托持有玖龙纸业绝对控股权（长期持股超 60%）。
  revenue_model: 大宗包装牛卡纸制造销售，年营收规模突破 600 亿元人民币。

key_decisions:
  - decision: 冒死拒绝香港废纸行业“掺水加泥”潜规则，以极致纯净度赢得信誉
    context: 当时香港废纸商普遍在纸包中故意浇水掺泥以虚增重量牟取暴利，导致内地造纸厂损耗巨大、设备频繁损坏。
    alternatives: 同流合污掺水赚取快钱；退出行业回内地继续做财务。
    risk: 遭遇香港废纸黑道势力砸场子、恐吓威胁，短时间内在同行中显得“格格不入”。
    reason: 明白低级作弊永远做不大，只有极致纯净的纸质才能获得大型国营纸厂的长期排他性采购合同。
    outcome: 扛住暴力恐吓，以诚实足称与零水分彻底征服内地买方，拿下全港最大的废纸配额出口权，积攒了千万级原始利润。
  - decision: 赴美创办中南控股，巧妙利用中美外贸“集装箱空返”进行极低成本海运
    context: 1990 年代中国商品大量出口美国，大量集装箱货船空船返回中国，海运存在巨大运力浪费。
    alternatives: 仅在东南亚就近采购劣质废纸；放弃全球原料进口。
    risk: 跨国法律、语言、环保关税合规风险极高。
    reason: 洞察到美国长纤维优质废纸利用率低，且利用回程空箱海运费极其低廉（甚至低至正常运费的 1/10）。
    outcome: 成为全美出口集装箱量最大的企业（连续多年蝉联全美出口集装箱货主第一名），将美国优质废纸源源不断低成本运回中国，构筑了玖龙无可匹敌的原料成本壁垒。

failures:
  - failure: 2008 年全球金融海啸遭遇外贸冰冻与国际做空机构围剿
    cause: 在 2007 年高景气期大举扩张产能背负大量外币银团债务，金融危机爆发后中国出口玩具与电子品断崖式下滑导致包装纸需求骤降；海外机构做空，股价暴跌超 90%。
    response: 绝不违约赖账，亲自飞往欧美各大债权银行面对面谈判，主动出示现金流底账与真实库存；推行“极限制造成本”，压缩一切行政开支，停建非核心项目。
    consequence: 成功获得国际银团债务展期，一年后中国出台 4 万亿经济刺激计划，玖龙纸业绝处逢生，股价暴涨十余倍全面收复失地。

turning_points:
  - event: 1995 年在广东东莞创立玖龙纸业，直接订购全球最先进的百万吨级大型造纸机。
    decision: 顶着所有人质疑，坚决不买二手落后设备，抵押全部资产订购欧洲顶级自动化设备。
    result: 玖龙单线产能和环保标准直接超越全国所有本土对手，一跃成为全球排名前列的工业造纸巨头。

relationships_and_power:
  mentors: 父亲（军人刚强品格的言传身教）。
  partners: 刘名中（丈夫、副董事长兼行政总裁，负责设备与国际业务）。
  networks: 中国包装联合会、国际废弃物循环利用协会 (ISRI)、广东省工商联。
  investors: 法国巴黎银行、汇丰银行等国际银团；香港知名基石投资人。
  institutions: 香港联交所、中国环境保护部。

wealth:
  starting_point: 负债 3 万元借款。
  wealth_creation_mechanism: 实体循环经济规模垄断 + 跨国供应链物流套利 + 香港主板上市资本杠杆。
  capital_strategy: 坚守实体制造核心，善用银行长期银团贷款与国际设备抵押融资，通过家族信托牢牢锁死控股权。

decision_patterns:
  - pattern: "重构供应链潜规则立足：在充斥短视作弊的野蛮行业中，反向坚持诚信底线，建立不可被颠覆的信誉护城河。"
  - pattern: "宏观逆向物流套利：利用全球贸易不平衡的底层结构性缝隙（如中美集装箱空返），实现原料成本的降维压制。"

anti_patterns:
  - pattern: "繁荣顶点激进借贷扩张：在经济周期最高峰盲目举借大额短期外币债务，导致在下行期遭遇流动性挤兑风险。"

transferability:
  highly_transferable:
    - "在混乱行业中坚持品质透明，以卓越信用赢得核心大客户终身信任。"
    - "利用物流不对称进行降本套利的商业敏锐度。"
    - "面对债务危机时主动面对债权人透明沟通，以实业底盘换取时间窗口。"
  context_dependent:
    - "中国 1990–2005 年成为'世界工厂'、轻工产品全球出口大爆发对包装纸产生的海量饥渴需求。"
    - "中国加入 WTO 带来的国际贸易黄金十年红利。"
  not_transferable:
    - "个人敢于在 1980 年代孤身周旋于香港黑白两道之间的非凡胆魄与草莽江湖穿透力。"

evidence:
  sources:
    - "玖龙纸业 (控股) 有限公司历年年报与香港联交所公告 (HKEX: 02689)"
    - "胡润百富榜历史榜单与人物财富调研档案 (2006-2024)"
    - "新华网、第一财经《中国首富张茵的造纸神话与危机突围》深度调查"
  evidence_level: "documented fact (香港联交所法定披露档案、经审计财务公报、权威商业媒体公认事实)"

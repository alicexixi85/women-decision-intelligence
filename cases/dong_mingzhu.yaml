identity:
  name: 董明珠 (Dong Mingzhu)
  nationality: 中国 (China)
  era: 现代 (1954年出生，1990年36岁南下格力起步)
  industry: 家用电器制造 / 实体工业 (Manufacturing / Home Appliances)
  role: 格力电器董事长兼总裁、工业企业家、全国人大代表

background:
  childhood: 出生于江苏南京普通工薪家庭，兄弟姐妹 7 人，性格坚毅好强。
  family: 丈夫早逝（1984年因病去世，当时董明珠年仅 30 岁，儿子仅 2 岁），成为单亲母亲。
  socioeconomic_background: 城市体制内普通工薪阶层，无任何政商背景或金融财富积累。
  education: 安徽省芜湖职业技术学院毕业，早期在南京一家化工研究所从事行政管理工作。
  initial_resources: 36 岁南下珠海海利（格力前身）时几乎身无分文，背负独自抚养幼儿的生活重压，无技术、无客户网络。

life_stage:
  age_at_key_decision: 36 岁南下珠海打工；40 岁接任经营部部长；58 岁正式出任格力电器董事长。
  relationship_status_if_relevant: 30 岁丧偶后终身未再婚，将全部生命能量与情感投注于企业经营。
  children_if_publicly_documented: 独子（公开记录其独立成长，未进入格力工作，成年后从事律师职业）。
  caregiving_responsibility_if_relevant: 36 岁南下时被迫将幼子托付在南京老家由母亲代为看护，长期处于母子异地分离状态，付出了深刻的情感代价。

constraints:
  financial: 早期无任何家庭储备与抗风险资金，一旦失业家庭生活立即停摆。
  family: 失去配偶经济支撑，单亲抚育幼子，家庭照护网络极度薄弱。
  reproductive: 关键决策时已过生育窗口，且选择不再婚，彻底排除育儿二次中断风险。
  social: 1990 年代中国家电销售一线被全男性烟酒应酬江湖垄断，女性销售极难立足。
  gender: 商业谈判中常遭遇男性经销商的轻视与推诿，被称为“外行女人”。
  career: 36 岁高龄转行做销售，从最基层的无保底提成业务员做起。
  age: 36 岁南下，在当时普遍被视为“职业生涯定型”的尴尬年龄。
  geography: 从熟悉的江南南京南下到语言、气候不通的经济特区珠海。
  immigration: 国内跨省流动。
  capital_access: 依附国企体制内部平台，无个人外部融资渠道，权力与资源全靠业绩拼杀。

career:
  previous_work: 南京化工研究所行政管理人员（15年体制内稳定工作）。
  transition: 36 岁砸碎铁饭碗，南下珠海海利空调器厂（格力前身）应聘基层业务员。
  business_model: 线下深度分销体系 + 区域销售公司同盟 (Jinghai Alliance) + 核心自主制造与技术掌控。
  source_of_capital: 国有控股上市平台内部留存资金 + 经销商预付款蓄水池。
  ownership: 早期作为职业经理人持有极低管理层激励股权（<1%）；历经国企混改后逐步增持为重要个人股东。
  revenue_model: 重资产家电制造与大宗批发，高周转、高预收款、严格应收账款控制。

key_decisions:
  - decision: 铁腕追讨 42 万陈年死账并确立“先款后货”铁律
    context: 1990 年入职格力接手安徽市场，前任业务员留下一笔 42 万元的拖欠货款，当地经销商态度蛮横。
    alternatives: 假装不知情，重新开拓新客户；妥协打折回款。
    risk: 被当地地头蛇人身威胁，业务彻底停滞甚至丢掉工作。
    reason: 若不解决应收账款恶疾，企业卖得越多死得越快；必须以战立威。
    outcome: 连续 40 天寸步不离堵在经销商门口，最终全额追回欠款；此后在格力彻底确立“绝不赊销、先打全款再发货”的革命性行业规则。
  - decision: 建立 28 家区域销售合资同盟并与国美黄光裕决裂
    context: 2004 年国美在未获格力许可的情况下擅自将格力空调大幅降价倾销。
    alternatives: 顺应家电连锁大卖场渠道霸权，接受压价与漫长账期。
    risk: 被全国最大连锁卖场全面封杀，销量断崖式下滑。
    reason: 决不让渠道商掐死制造企业的定价权和现金流。
    outcome: 果断全面撤出国美大卖场，联合各省大经销商组建“区域销售同盟公司”，经销商入股格力，彻底掌控渠道主权。

failures:
  - failure: 格力跨界造手机与收购珠海银隆新能源遇挫
    cause: 盲目相信个人个人品牌号召力，低估了智能手机行业极高的生态壁垒；在新能源电池技术路线上出现误判。
    response: 及时收缩手机终端业务，将新能源技术聚焦在工商业储能与特种冷链物流车辆。
    consequence: 承担数亿个人与企业试错成本，遭受资本市场与舆论的严重质疑。

turning_points:
  - event: 1994 年格力遭遇集体骨干辞职危机。
    decision: 当其他骨干集体跳槽竞争对手时，董明珠选择坚守，被总经理朱江洪破格提拔为经营部部长。
    result: 彻底重组格力销售制度，带领格力在 1995 年首次实现产销量全国第一。

relationships_and_power:
  mentors: 朱江洪（格力老董事长，早期的“伯乐”与战略合伙人，“朱董配”名震商界）。
  partners: 全国各大省份核心代理商与京海互联网科技公司。
  networks: 全国制造业同行、地方国资委、全国工业联合会。
  investors: 珠海国资委、高瓴资本（混改引入战略投资人）。
  institutions: 珠海市政府、深交所。

wealth:
  starting_point: 零，36岁时背负家庭生存赤字。
  wealth_creation_mechanism: 职业经理人顶级薪酬 + 上市公司长期股权分红 + 混改员工持股计划。
  capital_strategy: 专注主业现金流分红，极度排斥金融衍生工具炒作，将财富深锁于格力实体股票。

decision_patterns:
  - pattern: "应收账款生命线：无论市场多么诱人，绝不在没有现款保障的情况下铺货，用资金链安全构建最高防线。"
  - pattern: "打破讨喜诅咒：放弃做'老好人'，彻底拥抱冷峻的制度与数据铁腕，用不可替代的功勋奠定政治权威。"

anti_patterns:
  - pattern: "个人权威泛化：将单一实体制造领域的威望盲目套用到全然陌生的互联网/手机行业，忽视了生态转移成本。"

transferability:
  highly_transferable:
    - "将现金流与账期控制视为商业生存第一法则。"
    - "在组织内部通过啃最硬的骨头（如烂账、最难市场）建立不可动摇的话语权。"
    - "将经销商利益与自身绑成利益共同体对抗外部平台剥削。"
  context_dependent:
    - "1990–2000 年代中国城市化进程与居民空调普及率爆炸的时代红利。"
    - "地方国企改制与管理层MBO/激励历史政策窗口。"
  not_transferable:
    - "个人近乎超人的生理抗压强度与牺牲一切家庭温情的极致意志。"

evidence:
  sources:
    - "格力电器股份有限公司历年年度报告与招股说明书 (深交所: 000651)"
    - "董明珠自传《棋行天下》、《行棋无悔》"
    - "新华社、央视《对话》节目深度官方访谈"
  evidence_level: "documented fact (官方上市公司财报、正式自传、确证法务与商业历史事件)"

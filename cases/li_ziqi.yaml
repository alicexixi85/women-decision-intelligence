identity:
  name: 李子柒 (Li Ziqi / 李佳佳)
  nationality: 中国 (China)
  era: 现代 (1990年出生，2015年25岁回乡起步，2021年31岁维权停更，2024年34岁重组复出)
  industry: 新媒体文化 / 短视频IP / 东方美学消费 (Media / Cultural IP / Video)
  role: 全球顶流文化内容创作者、四川子柒文化控股人、吉尼斯世界纪录保持者

background:
  childhood: 出生于四川省绵阳市偏远乡村，父母早年离异，父亲早逝，曾遭受继母极度严重的家庭暴力与虐待（被按入水盆、揪头发毒打）。后被年迈贫苦的爷爷奶奶接回抚养。
  family: 爷爷是乡间做红白喜事的乡厨与篾匠，自幼耳濡目染学会传统编织、酿造与川菜烹饪；小学五年级时唯一的经济支柱爷爷不幸去世，与奶奶相依为命。
  socioeconomic_background: 绝对底层赤贫农民家庭，因付不起学费 14 岁被迫辍学进城谋生。
  education: 初中辍学，无高等学历；全部技能均在社会底层自学打磨。
  initial_resources: 零初始资产，早年在城市端盘子做服务员（月薪300元）、在夜店酒吧当 DJ 谋生。

life_stage:
  age_at_key_decision: 22 岁（2012年）因奶奶重病突发毅然辞去城市工作回乡侍奉照料；26 岁（2016年）单枪匹马自学拍摄剪辑传统田园手作；31 岁（2021年）发现商标与商业控制权被 MCN 机构实质架空，果断提起诉讼并宁可停更 3 年也要拿回主权；34 岁和解重组全面复出。
  relationship_status_if_relevant: 长期未婚，将个人核心情感完全寄托在与奶奶的亲情守护及非遗传统文化的淬炼中。
  children_if_publicly_documented: 无子女。
  caregiving_responsibility_if_relevant: 人生一切商业重大抉择的原初起点均由“照料病弱奶奶”触发，将家庭孝道与乡村实体生活方式直接转化为全球文化产品的终极灵魂。

constraints:
  financial: 早期仅靠一台二手单反相机和一台简陋三脚架，全靠自己徒手爬树、架机位、劈柴揉面。
  family: 唯一亲人是年迈体弱的高龄奶奶，需要时刻在身边看护伺候，无法离开乡村物理空间。
  reproductive: 青年时期全身心投入重体力视频摄制，延后个人婚育生活。
  social: 农村辍学青年在大众偏见中常被归为“底层打工妹”，早期在商业法务谈判中处于极度信息劣势。
  gender: 独立女性在乡村独居创业，常遭遇村民风言风语、甚至偷拍骚扰，早期独自一人承受沉重农活体力负荷。
  career: 面对老牌 MCN 机构精密的“股权顶层设计”陷阱，陷入“出名却无法分享核心电商收益”的被动绝境。
  age: 25 岁起步，31 岁遭遇毁灭性控制权纠纷与停更风暴。
  geography: 四川绵阳深山农村，远离北上广杭电商与内容资本中心。
  immigration: 本土乡村向城市流动后再逆向回流乡村。
  capital_access: 早期与资本合作时，因缺乏专业法务团队把关，签署了极度不平等的合资公司架构。

career:
  previous_work: 餐馆服务员、夜店音乐 DJ、淘宝小店农产品卖家。
  transition: 2012 年回乡照顾病危奶奶，为维持生计在淘宝开网店卖老家核桃等农货，为吸引客流自学拍摄田园古风美食短视频。
  business_model: 东方美学非遗文化微电影 + 全球 YouTube 广告分成 + 联名文化超级消费品牌（螺蛳粉、藕粉等）。
  source_of_capital: 个人淘宝微薄收益自筹设备 + 杭州微念早期流量推广支持。
  ownership: 早期持有合资公司四川子柒文化 49% 股份，在母公司杭州微念持股为零；2022 年司法和解后，李子柒个人持股飙升至 99%，彻底掌控四川子柒文化。
  revenue_model: YouTube 全球数千万海外订阅的高额美元广告分成、品牌独家商标授权与衍生实业分红。

key_decisions:
  - decision: 奶奶病重时毅然斩断城市一切营生，回归深山陪伴
    context: 2012 年在城市酒吧当 DJ 虽有一定收入，但老家奶奶突发重病无人照管，面临随时离世的风险。
    alternatives: 继续留在城市打拼，寄钱回乡雇佣远亲代看。
    risk: 彻底失去稳定现金流收入，回到偏僻农村无任何工业就业机会。
    reason: 坚信“人活一世，至亲在身边才是一切安心的根源”；绝不能让自己承受“子欲养而亲不待”的终身悔恨。
    outcome: 这一回归彻底塑造了其作品无可替代的“真实生活质感与家庭依恋”，成为其击穿全球亿万城市人群焦虑心灵的精神灯塔。
  - decision: 发现商业主权被架空后，宁可停更 3 年也绝不对资本妥协，诉诸法律决裂
    context: 2021 年“李子柒”品牌螺蛳粉等年销数十亿，但核心知识产权、天猫旗舰店与供应链全由杭州微念直接运营，李子柒仅为合资公司少数股东，被资方当做纯粹的“视频生成工具人”。
    alternatives: 维持现状，接受资方给出的少许年终分红，继续高频更新做名义偶像。
    risk: 长时间停更可能导致全网流量快速遗忘、短视频算法迭代更替、被无数模仿者迅速分流蚕食。
    reason: 明白若不解决根本所有权，“李子柒”这三个字将被外部资本彻底滥用甚至毁掉；没有主权的名气只是泡沫。
    outcome: 宣布全面停更，连续提起多轮诉讼，以超强的耐心打持久战，最终迫使资方达成全面和解，拿回了“李子柒”全部商标控制权并将四川子柒文化股权提升至 99%，完成了中国网红史上最惊险的控股反杀。

failures:
  - failure: 早期缺乏商事法务防御意识，陷入“同股不同权与母子公司分离”的资本协议陷阱
    cause: 2016–2017 年作为单纯的农村创作者，对复杂的公司法、母子公司架构、VIE 协议与商标持有人制度缺乏认知，轻易听信资方口头承诺。
    response: 觉醒后迅速求助于国内顶级知识产权与反垄断诉讼律师团，利用民法典关于姓名权、人格权保护的最新司法解释进行全面法律反击。
    consequence: 付出了长达三年黄金创作期停更停产的巨大代价，错失了海外电商直接出海的爆发期，但最终成功夺回了核心主权。

turning_points:
  - event: 2016 年短视频《兰州牛肉面》爆火全网。
    decision: 坚持不用替身与电脑特效，历时数月向兰州老师傅亲自学习拉面，揉断上千团面粉，录制超过 200 个分镜。
    result: 全网播放量突破 5000 万，美拍与微博点赞数百万，一举奠定东方田园诗意手作天花板地位。

relationships_and_power:
  mentors: 爷爷（手艺与做人道德领路人）。
  partners: 奶奶（精神寄托与作品核心灵魂）；后期专业商业法务与非遗工匠团队。
  networks: 全球非物质文化遗产传承人网络、中国农村青年致富带头人协会、央视与新华社官方文化外宣矩阵。
  investors: 早期引入杭州微念（后和平清退与重组）。
  institutions: 吉尼斯世界纪录组织、四川省文联、绵阳市中级人民法院。

wealth:
  starting_point: 零，早年月薪 300 元。
  wealth_creation_mechanism: 全球顶级文化内容流量变现 + 自主控股核心文化 IP 的长期商业特许授权与实业分红。
  capital_strategy: 坚守 99% 个人绝对独资控股，不轻易被外部纯财务 VC 稀释，将知识产权牢牢锁在个人手中。

decision_patterns:
  - pattern: "极致匠心慢工出细活：用超越常人理解的漫长制作周期（如历时一年拍摄文房四宝、历时三年酿造酱油），制造任何流水线 MCN 无法模仿的质感壁垒。"
  - pattern: "停更止损打持久战：面对不公资本剥削时，敢于按下暂停键，用时间作为杠杆瓦解对方的现金流压力，逼迫资方让步。"

anti_patterns:
  - pattern: "在股权架构尚未清晰确权前将个人核心人格符号（姓名、肖像、艺名商标）轻易授权给外部第三方注册掌控。"

transferability:
  highly_transferable:
    - "个人 IP 在创立第一天必须将所有核心品类商标注册在自己 100% 控股的主体下。"
    - "将真实的人生痛点与孝道羁绊转化为产品的真诚内核。"
    - "遭遇控制权危机时，敢于壮士断腕停更诉讼，以时间换空间夺回控制权。"
  context_dependent:
    - "2016–2020 年中国传统文化出海与 YouTube 全球算法对东方慢生活田园纪实内容的极高推荐权重。"
  not_transferable:
    - "一个人独立掌握木工、瓦工、染织、酿造、川菜、刺绣等数十门高难度古法非遗技能的非凡手艺学习天赋。"

evidence:
  sources:
    - "四川省绵阳市中级人民法院民事调解书及国家知识产权局商标权变更公告"
    - "新华社深度专访：《李子柒：我渴望把东方美学做成一个可持续的文化印记》"
    - "Guinness World Records: Most subscribers for a Chinese language channel on YouTube"
  evidence_level: "documented fact (法院官方裁判文书、国家知识产权局公开档案、吉尼斯认证数据)"

identity:
  name: 何巧女 (He Qiaonv)
  nationality: 中国 (China)
  era: 现代 (1966年出生，1992年26岁创立东方园林，2018年52岁遭遇债务崩塌)
  industry: 生态环保 / 市政工程 / PPP基建投资 (Landscape Architecture / Environmental PPP)
  role: 【反面警示案例 / Anti-Pattern】东方园林创始人、前董事长兼实际控制人、曾任浙江女首富

background:
  childhood: 出生于浙江金华武义县农村，父亲为当地林业站工人兼花农，自幼随父亲在山间摆弄花草盆景。
  family: 农村普通工薪家庭，兄弟姐妹 5 人，具有江浙人骨子里的重商与冒险基因。
  socioeconomic_background: 乡村中下层，无大额启动资本。
  education: 北京林业大学园林系学士学位（1988年毕业），具备扎实的植物学与园林规划功底。
  initial_resources: 杭州植物园初级技术员资历，辞职回京在亚运会盆景展会上通过出租苗木赚取首批数万元外贸与展销利润。

life_stage:
  age_at_key_decision: 26 岁自立门户成立东方园林；43 岁（2009年）带领东方园林登陆 A 股成为“中国园林第一股”；48–51 岁（2014–2017年）疯狂押注政府和社会资本合作 (PPP) 模式狂揽千亿订单；52 岁遭遇发债暴雷与百亿债务雪崩。
  relationship_status_if_relevant: 与大学同系同学唐凯结婚，夫妻共同长期持有东方园林控股权并担任高管。
  children_if_publicly_documented: 育有一子，家庭在企业顺境时全员持股。
  caregiving_responsibility_if_relevant: 长期高强度扑在全国市政基建跑马圈地中，将企业视为最高生命支柱，疏于个人家庭财务防火墙建设。

constraints:
  financial: 市政工程与生态治理天然具有“垫资施工、回款周期极长（2–5年）、极度依赖地方财政充裕度”的致命缺陷。
  family: 将个人与家族全部身家资产与上市公司股权进行 100% 高比例质押，彻底丧失风险隔离。
  reproductive: 创业成熟期已过生育窗口。
  social: 中国市政基建与大型工程招投标是典型的政商交织、男性官员与大建筑国企主导的重工业场域。
  gender: 在大型市政基建谈判中，极度渴望证明女性民营企业家也能做“国家级超级工程”，产生了超常的虚荣与跃进冲动。
  career: 上市后虚名加身，被称为“商界花木兰”、“女巴菲特”，被公众赞誉推向神坛后难以接受任何业务收缩。
  age: 50 岁左右处于权力欲望与宏大叙事最膨胀的临界点。
  geography: 从浙江乡村到北京总部，足迹遍布全国数百个三四线城市 PPP 示范工程。
  immigration: 本土公民。
  capital_access: 早期依赖 A 股高市盈率定增与商业银行基建授信，在宏观金融去杠杆时遭遇断崖式抽贷。

career:
  previous_work: 杭州植物园技术员、外企盆景租摆销售经理。
  transition: 从早期地产高端园林绿化，向政府主导的城市大型流域治理与生态 PPP 业务大举转轨。
  business_model: 短期大额债务发债垫资 + 中标数百亿地方政府生态 PPP 项目 + 长期应收款计提利润（纸面富贵）。
  source_of_capital: 银行短期流动贷款 + 超短期融资券发债 + 控股股东大比例股票股权质押。
  ownership: 巅峰期持有东方园林超 40% 绝对控股股权；暴雷后全部股权被司法冻结并被迫出让控制权给朝阳区国资委。
  revenue_model: 政府市政工程回款与施工进度款结算（极度缺乏经营性现金造血能力）。

key_decisions:
  - decision: 2014 年全面转型押注 PPP（政府和社会资本合作）模式，狂飙揽下千亿大单
    context: 传统房地产园林绿化竞争白热化，国家出台鼓励民间资本参与市政环保的 PPP 政策红利。
    alternatives: 保持稳健的中型园林企业规模，严控垫资，只接现款现结的优质民企工程。
    risk: PPP 项目多为三四线地方政府项目，投资规模高达数百亿，建设期需全额自筹垫资，运营期长达 10–20 年，一旦地方财政吃紧或国家金融收紧，资金链瞬间碎裂。
    reason: 极度沉迷于宏大叙事，豪言“东方园林要成为全球最大的生态环保企业”，试图用千亿订单吹大市值。
    outcome: 短短三年中标超 1500 亿 PPP 项目，但账面现金流净额连续多年为巨额负数（仅 2017 年经营现金流缺口超数十亿），为日后的崩塌埋下致命祸根。
  - decision: 在宏观金融去杠杆前夜，将个人所持上市公司股权质押率推高至近 100%
    context: 面对垫资产生的巨大现金黑洞，银行授信开始收紧。
    alternatives: 果断砍停亏损 PPP 项目，向市场折价定增或转让部分资产自救止血。
    risk: 一旦股价下跌触及平仓线，且外部流动性冻结，大股东将彻底失去公司所有权并背负无限连带清偿责任。
    reason: 误以为股价永远会上涨，地方政府绝不会违约，坚信自己能“借新还旧”把雪球滚下去。
    outcome: 遭遇 2018 年 5 月史诗级发债惨败：计划发行 10 亿元公司债，最终仅募得 5000 万元，市场信心瞬间雪崩，股价连续跌停，股权质押全线爆仓。

failures:
  - failure: 2018 年“史上最惨发债”引爆全盘流动性危机与控制权易主
    cause: 短贷长投、极度激进的债务杠杆错配、地方政府应收账款无法兑现、国家宏观金融去杠杆严控表外融资。
    response: 仓皇求助于北京市朝阳区国资委紧急纾困，被迫签订城下之盟出让控制权与表决权。
    consequence: 个人被列为限制高消费人员与失信被执行人，名下数套豪宅被法院司法拍卖，千亿市值帝国在短短一年内分崩离析。

turning_points:
  - event: 2017 年在摩纳哥世界自然保护联盟大会上公开承诺个人捐资 15 亿美元（约 100 亿元人民币）保护野生动物。
    decision: 在公司现金流已极度紧张的虚假繁荣期，高调做出全球最大额个人环保慈善捐赠承诺以博取国际盛誉。
    result: 随后暴雷使该捐赠成为无法兑现的笑柄，极大损害了其个人诚信底线，沦为社会公信力破产的标志性事件。

relationships_and_power:
  mentors: 父亲（苗木启蒙）；国内部分老牌宏观商界同盟。
  partners: 地方城投平台、中国交建等大型央企联合体。
  networks: 全国工商联知名企业家理事会、中国女企业家协会核心圈。
  investors: 民生银行、广发证券等承销银团（后全面成为索赔债权人）。
  institutions: 北京市朝阳区国资委（最终接盘接管方）。

wealth:
  starting_point: 零。
  wealth_creation_mechanism: 纸面市值繁荣（A股最高市值近 600 亿元，个人身价超 300 亿元，一度登顶浙江女首富）。
  capital_strategy: 【典型负面案例】以个人无限担保疯狂加杠杆，短贷长投，无任何独立信托防火墙，在周期反转时遭遇毁灭性清零。

decision_patterns:
  - pattern: "【致命反模式】宏大叙事自我催眠：将政策窗口与虚假合同金额当做真实利润，把不可持续的短期杠杆视为个人战略智慧。"
  - pattern: "【致命反模式】短贷长投资产错配：以 1–2 年期的短期高息借贷去垫资建设回收期需 15 年的重度市政工程。"

anti_patterns:
  - pattern: "无节制股权质押与无限连带担保：在商业扩张中赌上个人与家族的全部合法资产，彻底丧失在危机中的退路与安全岛。"

transferability:
  highly_transferable:
    - "作为【绝对负面警示红线】：任何女性创业者绝不可在现金流净额为负的情况下盲目举债扩张。"
    - "必须将大股东个人财产与企业债务做严格的法律隔离，绝不可全额质押股权加杠杆。"
    - "警惕地方政府 PPP 和市政工程漫长回款周期的致命陷阱，重视应收账款账面利润的欺骗性。"
  context_dependent:
    - "2014–2017 年中国地方政府与民间资本合作 (PPP) 政策狂飙推进的特定历史投机红利。"
  not_transferable:
    - "无。"

evidence:
  sources:
    - "北京东方园林环境股份有限公司历年巨额诉讼公告与深交所监管函 (SZ: 002310)"
    - "中国执行信息公开网失信被执行人名单查询记录"
    - "财新周刊深度调查封面报道：《东方园林债务风暴与何巧女的千亿赌局》(2018)"
  evidence_level: "documented fact (深交所上市公司公告、中国最高法失信执行记录、财新深度专业金融调查)"
